<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>admin</title>
    <style>
      body { max-width: 640px; margin: 60px auto; padding: 0 16px; font: 15px/1.5 ui-monospace, Menlo, monospace; background: #eee6d2; color: #14301f; }
      input, button { font: inherit; }
      input { padding: 6px 8px; border: 1px solid #14301f; background: #fbf8f1; }
      button { padding: 6px 10px; border: 0; background: #14301f; color: #eee6d2; cursor: pointer; }
      li { display: flex; gap: 12px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid rgba(20, 48, 31, 0.15); }
      li p { flex: 1; margin: 0; overflow-wrap: anywhere; }
      li small { opacity: 0.6; white-space: nowrap; }
      li button { background: #c7422c; padding: 2px 8px; }
      ul { padding: 0; list-style: none; }
      #msg { color: #c7422c; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <h1>sticky notes</h1>
    <form id="login"><input id="code" type="password" placeholder="code" autocomplete="off" /> <button>enter</button></form>
    <p id="msg"></p>
    <div id="panel" hidden><p>signed in. the ✕ buttons also show on the notes on the site. <button id="out">sign out</button></p><ul id="list"></ul></div>
    <p><a href="/">← back to the site</a></p>
    <script>
      // same database as the site; the code is checked by the database, never stored in this page
      const NOTES_DB = { url: "https://gffwlygcblzmcbuazmms.supabase.co", key: "sb_publishable_WXdUlPLesr2Thm5EWrnJtw_JWOIWwTp" };
      const $ = (id) => document.getElementById(id);
      async function api(path, body) {
        const r = await fetch(`${NOTES_DB.url}/rest/v1/${path}`, { method: body ? "POST" : "GET", headers: { apikey: NOTES_DB.key, "Content-Type": "application/json" }, body: body && JSON.stringify(body) });
        const t = await r.text(), d = t ? JSON.parse(t) : null;
        if (!r.ok) throw new Error(d?.message || "couldn't reach the notes");
        return d;
      }
      const saved = () => { try { return localStorage.getItem("notes-admin") || ""; } catch { return ""; } };
      const save = (c) => { try { c ? localStorage.setItem("notes-admin", c) : localStorage.removeItem("notes-admin"); } catch {} };
      async function showPanel(code) {
        $("login").hidden = true;
        $("panel").hidden = false;
        const notes = await api("notes?select=id,body,name,created_at&order=created_at.desc&limit=500");
        $("list").replaceChildren(...notes.map((n) => {
          const li = document.createElement("li"), p = document.createElement("p"), sm = document.createElement("small"), b = document.createElement("button");
          p.textContent = n.body + (n.name ? ` — ${n.name}` : "");
          sm.textContent = new Date(n.created_at).toLocaleString();
          b.textContent = "✕";
          b.onclick = async () => {
            try { await api("rpc/delete_note", { note_id: n.id, code }); li.remove(); } catch (e) { $("msg").textContent = e.message; }
          };
          li.append(p, sm, b);
          return li;
        }));
        if (!notes.length) $("list").innerHTML = "<li>no notes yet.</li>";
      }
      $("login").onsubmit = async (e) => {
        e.preventDefault();
        const code = $("code").value;
        try {
          if (!(await api("rpc/is_admin", { code }))) return ($("msg").textContent = "wrong code");
          $("msg").textContent = "";
          save(code);
          showPanel(code);
        } catch (e) { $("msg").textContent = e.message; }
      };
      $("out").onclick = () => { save(""); location.reload(); };
      if (!NOTES_DB.key) $("msg").textContent = "the database key isn't set yet.";
      else if (saved()) showPanel(saved()).catch((e) => ($("msg").textContent = e.message));
    </script>
  </body>
</html>
